<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Lora:ital,wght@0,400;0,500;1,400&display=swap">
<style>
[hidden] { display: none !important; }
body { margin: 0; }

/* Layout: one envelope centered on a night sky; tap the seal and the letter slides out onto paper. */
:root {
  color-scheme: dark;
  --sky: #15142a;
  --sky-2: #2a2148;
  --star: #e9e4ff;
  --paper: #fbf7f2;
  --ink: #2b2740;
  --ink-soft: #6a6482;
  --accent: #d97b93;
  --accent-deep: #a8506a;
  --env: #f1d9df;
  --env-shade: #e2c2ca;
  --ui: #ffffffcc;
  --ui-line: #ffffff2e;
  --hand: "Caveat", "Segoe Print", "Bradley Hand", cursive;
  --serif: "Lora", Georgia, "Times New Roman", serif;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
:root[data-accent="lavender"] { --accent: #9b86d6; --accent-deep: #6c58a8; --env: #e5defa; --env-shade: #d3c8f0; }
:root[data-accent="sky"] { --accent: #6fa3d8; --accent-deep: #406f9e; --env: #dcebf8; --env-shade: #c6dcef; }
:root[data-accent="sage"] { --accent: #7fae8e; --accent-deep: #4f7f5e; --env: #e0efe4; --env-shade: #c9e0cf; }

* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  background: radial-gradient(120% 80% at 50% 0%, var(--sky-2), var(--sky) 70%) fixed, var(--sky);
  color: var(--star);
  font-family: var(--sans);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px 56px;
  overflow-x: hidden;
}
#stars { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
#app { position: relative; z-index: 1; max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; align-items: center; gap: 24px; }

.toolbar { align-self: stretch; display: flex; justify-content: flex-end; gap: 8px; min-height: 36px; }
.btn {
  font: 500 14px/1 var(--sans); color: var(--star); background: transparent;
  border: 1px solid var(--ui-line); border-radius: 999px; padding: 10px 16px; cursor: pointer;
}
.btn:hover { background: #ffffff14; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #1a1426; font-weight: 600; }
.btn.primary:hover { background: var(--accent-deep); border-color: var(--accent-deep); color: #fff; }
.btn:focus-visible, .seal:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible, .swatch:focus-visible {
  outline: 2px solid var(--star); outline-offset: 3px;
}

/* Envelope */
.stage { display: flex; flex-direction: column; align-items: center; gap: 18px; width: 100%; }
.for { font-family: var(--hand); font-size: clamp(28px, 7vw, 40px); color: var(--star); text-align: center; text-wrap: balance; margin: 0; }
.envelope {
  position: relative; width: min(100%, 360px); aspect-ratio: 3 / 2; max-width: 100%;
  background: var(--env); border-radius: 6px; box-shadow: 0 24px 50px -18px #00000099;
}
.envelope::before { content: ""; position: absolute; inset: 0; border-radius: 6px; pointer-events: none; }
.envelope::before { /* side folds */
  background:
    linear-gradient(to top right, transparent 49.6%, var(--env-shade) 50%) left / 50% 100% no-repeat,
    linear-gradient(to top left, transparent 49.6%, var(--env-shade) 50%) right / 50% 100% no-repeat;
  opacity: .55;
}
.flap {
  pointer-events: none;
  position: absolute; left: 0; right: 0; top: 0; height: 58%;
  background: var(--env-shade); clip-path: polygon(0 0, 100% 0, 50% 100%);
  transform-origin: top; transition: transform .6s ease;
}
.opened .flap { transform: rotateX(180deg); }
.seal {
  position: absolute; left: 50%; top: 58%; transform: translate(-50%, -50%);
  width: 64px; height: 64px; border-radius: 50%; border: 0; cursor: pointer;
  background: radial-gradient(circle at 35% 30%, var(--accent), var(--accent-deep));
  box-shadow: 0 4px 10px #00000055, inset 0 -3px 6px #00000033;
  display: grid; place-items: center; z-index: 2; touch-action: manipulation; transition: transform .25s ease, opacity .4s ease;
}
.seal:hover { transform: translate(-50%, -50%) scale(1.06); }
.seal svg { width: 28px; height: 28px; fill: #ffffffe6; }
.opened .seal { opacity: 0; pointer-events: none; }
.hint { font-size: 13px; letter-spacing: .06em; color: #cfc8ecaa; margin: 0; }

/* Letter */
.letter {
  width: 100%; background: var(--paper); color: var(--ink);
  border-radius: 4px; padding: clamp(24px, 6vw, 48px) clamp(20px, 6vw, 52px);
  box-shadow: 0 30px 60px -24px #000000aa;
  background-image: repeating-linear-gradient(to bottom, transparent 0 33px, #2b27400d 33px 34px);
  animation: rise .8s ease both;
}
@keyframes rise { from { transform: translateY(24px); opacity: .0; } to { transform: none; opacity: 1; } }
.photo {
  float: right; width: 38%; max-width: 190px; margin: -6px -4px 14px 18px;
  background: #fff; padding: 8px 8px 22px; transform: rotate(3deg);
  box-shadow: 0 8px 18px -8px #2b274066; position: relative;
}
.photo::before { /* tape */
  content: ""; position: absolute; top: -10px; left: 50%; width: 64px; height: 20px;
  transform: translateX(-50%) rotate(-4deg); background: color-mix(in srgb, var(--accent) 45%, #ffffff99);
  opacity: .85;
}
.photo img { display: block; width: 100%; aspect-ratio: 4 / 5; object-fit: cover; }
.letter::after { content: ""; display: block; clear: both; }
.letter .date { font-family: var(--sans); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-soft); margin: 0 0 18px; }
.letter .greet { font-family: var(--hand); font-size: clamp(30px, 7vw, 38px); color: var(--accent-deep); margin: 0 0 14px; line-height: 1.1; }
.letter .body { font-family: var(--serif); font-size: 17px; line-height: 2; max-width: 62ch; }
.letter .body p { margin: 0 0 1em; }
.letter .closing { font-family: var(--serif); font-style: italic; font-size: 17px; margin: 28px 0 2px; }
.letter .sign { font-family: var(--hand); font-size: clamp(32px, 8vw, 42px); color: var(--ink); margin: 0; line-height: 1.1; }
.letter .ps { font-family: var(--serif); font-size: 15px; color: var(--ink-soft); margin: 22px 0 0; }
.again { margin-top: 4px; }

@media (prefers-reduced-motion: reduce) {
  .flap, .seal, .letter { transition: none; animation: none; }
}
</style>
</head>
<body>
<canvas id="stars" aria-hidden="true"></canvas>
<main id="app">
  
  <section class="stage" id="stage">
    <p class="for" id="forLine"></p>
    <div class="envelope" id="envelope">
      <div class="flap"></div>
      <button class="seal" id="seal" type="button" aria-label="Open the letter">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.6 4.5c2.1 0 3.5 1.2 4.4 2.5.9-1.3 2.3-2.5 4.4-2.5 3.6 0 5.7 3.9 4.2 7.3C19.5 16.4 12 21 12 21z"/></svg>
      </button>
    </div>
    <p class="hint" id="hint">Tap the seal to open</p>
  </section>

  <article class="letter" id="letter" hidden>
    <figure class="photo" id="lPhotoWrap" hidden><img id="lPhoto" alt=""></figure>
    <p class="date" id="lDate"></p>
    <p class="greet" id="lGreet"></p>
    <div class="body" id="lBody"></div>
    <p class="closing" id="lClosing"></p>
    <p class="sign" id="lFrom"></p>
    <p class="ps" id="lPs" hidden></p>
  </article>
  <button class="btn again" id="again" type="button" hidden>Close the envelope</button>

  </main>

<script>
(function () {
  const $ = id => document.getElementById(id);
  const state = LETTER;
  state.body = $('message').textContent.replace(/^\s*\n/, '').replace(/\s+$/, '');
  document.documentElement.setAttribute('data-accent', state.color || 'rose');

  $('forLine').textContent = state.to ? 'For ' + state.to : 'For you';
  $('lDate').textContent = state.date || '';
  $('lGreet').textContent = state.greeting || '';
  state.body.split(/\n\s*\n/).forEach(par => {
    if (!par.trim()) return;
    const p = document.createElement('p');
    par.trim().split('\n').forEach((line, i) => {
      if (i) p.appendChild(document.createElement('br'));
      p.appendChild(document.createTextNode(line.trim()));
    });
    $('lBody').appendChild(p);
  });
  $('lClosing').textContent = state.closing || '';
  $('lFrom').textContent = state.from || '';
  if (state.photo) {
    const img = $('lPhoto');
    img.onerror = () => { $('lPhotoWrap').hidden = true; };
    img.src = state.photo;
    $('lPhotoWrap').hidden = false;
  }
  if (state.ps) { $('lPs').textContent = 'P.S. ' + state.ps; $('lPs').hidden = false; }

  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  $('seal').addEventListener('click', () => {
    $('envelope').classList.add('opened');
    $('hint').hidden = true;
    setTimeout(() => {
      $('stage').hidden = true; $('letter').hidden = false; $('again').hidden = false;
      $('letter').scrollIntoView({ behavior: 'smooth', block: 'start' });
    }, reduce ? 0 : 650);
  });
  $('again').addEventListener('click', () => {
    $('letter').hidden = true; $('again').hidden = true;
    $('stage').hidden = false; $('hint').hidden = false;
    $('envelope').classList.remove('opened');
  });

  function drawStars() {
    const c = $('stars');
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const w = innerWidth, h = innerHeight;
    c.width = w * dpr; c.height = h * dpr; c.style.width = w + 'px'; c.style.height = h + 'px';
    const ctx = c.getContext('2d'); ctx.scale(dpr, dpr);
    let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
    for (let i = 0, n = Math.round(w * h / 9000); i < n; i++) {
      ctx.globalAlpha = .15 + rnd() * .6; ctx.fillStyle = '#e9e4ff';
      ctx.beginPath(); ctx.arc(rnd() * w, rnd() * h, rnd() * 1.3 + .2, 0, Math.PI * 2); ctx.fill();
    }
  }
  drawStars(); addEventListener('resize', drawStars);
})();
</script>
</body>
</html>
